name: Generate and Deploy DMXAPI Free Models RSS

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'

# Prevent concurrent runs updating data/history.json and gh-pages branch simultaneously
concurrency:
  group: dmx-rss-sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Free Models and Generate Feeds
        env:
          DMX_API_KEY: ${{ secrets.DMX_API_KEY || 'sk-oLm648AcatWOQQB9N0rFvylA5roHsuk0BI5iDqIPte2awTfX' }}
        run: |
          python fetch_free_models.py

      - name: Commit and Push Model History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): update model history [skip ci]"
          file_pattern: "data/history.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Deploy Feed to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Automated Feed Update [skip ci]"
